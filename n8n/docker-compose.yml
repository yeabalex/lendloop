services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET must be set}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:?CONVEX_SITE_URL must be set}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
